<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 76" fill="none">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
    .label { font-size: 12px; font-weight: 600; }
    .sublabel { font-size: 11px; opacity: 0.7; }
    .box { stroke-width: 1.5; rx: 6; ry: 6; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="12" y="12" width="120" height="52" class="box" stroke="#7c3aed" fill="#7c3aed" fill-opacity="0.08"/>
  <text x="72" y="34" text-anchor="middle" class="label" fill="#7c3aed">Drizzle schema</text>
  <text x="72" y="50" text-anchor="middle" class="sublabel" fill="#6b7280">db/schema.ts</text>

  <rect x="172" y="12" width="100" height="52" class="box" stroke="#7c3aed" fill="#7c3aed" fill-opacity="0.08"/>
  <text x="222" y="34" text-anchor="middle" class="label" fill="#7c3aed">DB types</text>
  <text x="222" y="50" text-anchor="middle" class="sublabel" fill="#6b7280">.void/db.d.ts</text>

  <rect x="330" y="14" width="130" height="48" class="box" stroke="#2563eb" fill="#2563eb" fill-opacity="0.08"/>
  <text x="395" y="35" text-anchor="middle" class="label" fill="#2563eb">Route handlers</text>
  <text x="395" y="51" text-anchor="middle" class="sublabel" fill="#6b7280">routes/**/*.ts</text>

  <rect x="500" y="14" width="100" height="48" class="box" stroke="#2563eb" fill="#2563eb" fill-opacity="0.08"/>
  <text x="550" y="35" text-anchor="middle" class="label" fill="#2563eb">Route types</text>
  <text x="550" y="51" text-anchor="middle" class="sublabel" fill="#6b7280">RouteMap</text>

  <rect x="640" y="14" width="68" height="48" class="box" stroke="#2563eb" fill="#2563eb" fill-opacity="0.08"/>
  <text x="674" y="35" text-anchor="middle" class="label" fill="#2563eb">fetch()</text>
  <text x="674" y="51" text-anchor="middle" class="sublabel" fill="#6b7280">client</text>

  <line x1="132" y1="38" x2="170" y2="38" class="arrow" stroke="#9ca3af"/>
  <line x1="272" y1="38" x2="328" y2="38" class="arrow" stroke="#9ca3af"/>
  <line x1="460" y1="38" x2="498" y2="38" class="arrow" stroke="#9ca3af"/>
  <line x1="600" y1="38" x2="638" y2="38" class="arrow" stroke="#9ca3af"/>
</svg>
